name: Websites
# The website snapshots (explorer.pocol.net, ide.pocol.net, pocol.net), the Studio site and the gateways behind them:
# the PHP (pocol.net) and browser security checks, the explorer gateway's /api reads and its host's Caddy site (with the fee faucet's route), the website identity tool's --check, and the guards that keep host credentials
# (config.php) out of the repository. Local only: nothing here contacts a pocol.net host or deploys anything.
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/websites/**'
      - 'prototypes/pocol-studio/**'
      - 'prototypes/pocol-extension/src/**'
      - 'deploy/studio/**'
      - 'deploy/rewards/gateway.py'
      # Sites W8: the explorer snapshot's /api reads (explorer_api.py, its tests and recorded PHP vectors) and the
      # explorer gateway host's Caddy site, static copy and installer.
      - 'deploy/rewards/explorer_*.py'
      - 'deploy/rewards/test_explorer_api.py'
      - 'deploy/rewards/testdata/*explorer*'
      - 'deploy/explorer/**'
      # The fee faucet and its /faucet/* route in the explorer block (the explorer installer and its tests import it).
      - 'deploy/faucet/**'
      # What site_identity.py --check and its tests read besides the snapshots: the identity tool it imports, its
      # retired list and placeholder (deploy/mainnet), that tool's imports, the node's SPEC_VERSION, the extension
      # version the download links must name, and the decoder corpus the tests take their spec-2 genesis from.
      - 'deploy/mainnet/**'
      - 'deploy/rewards/pocol_rewards.py'
      - 'deploy/public-testnet/pocol_identity.py'
      - 'prototypes/lp1-node/src/genesis_spec.rs'
      - 'prototypes/pocol-extension/package.json'
      - 'prototypes/pocol-extension/tests/data/decoder-corpus-v3.json'
      # Sites W14: the native package names the sites may name (assemble_release.py at package.py's version).
      - 'deploy/release/assemble_release.py'
      - 'deploy/standalone/package.py'
      # Sites W7: explorer_w7.test.mjs checks the decoder's selectors against the Registry signatures there.
      - 'prototypes/lp4-execution/contracts/system/PoColSystemV3.sol'
      # test_launch_decisions.py (OWNER-DECISIONS-2026-11-20): the readiness fields the status page names, the
      # public-network scope name, and the client user interface sources it checks for superseded launch claims.
      - 'prototypes/pocold/src/readiness.rs'
      - 'prototypes/lp4-execution/src/admission/scope.rs'
      - 'prototypes/pocol-windows/**'
      - 'prototypes/pocol-android/app/src/main/**'
      # A config.php anywhere (the .gitignore rule covers only api/ directories) runs the tracked-config.php guard.
      - '**/config.php'
      - '.gitignore'
      - '.github/workflows/websites.yml'
  push:
    branches: [main]
    # The same paths as pull_request.
    paths:
      - 'deploy/websites/**'
      - 'prototypes/pocol-studio/**'
      - 'prototypes/pocol-extension/src/**'
      - 'deploy/studio/**'
      - 'deploy/rewards/gateway.py'
      - 'deploy/rewards/explorer_*.py'
      - 'deploy/rewards/test_explorer_api.py'
      - 'deploy/rewards/testdata/*explorer*'
      - 'deploy/explorer/**'
      - 'deploy/faucet/**'
      - 'deploy/mainnet/**'
      - 'deploy/rewards/pocol_rewards.py'
      - 'deploy/public-testnet/pocol_identity.py'
      - 'prototypes/lp1-node/src/genesis_spec.rs'
      - 'prototypes/pocol-extension/package.json'
      - 'prototypes/pocol-extension/tests/data/decoder-corpus-v3.json'
      - 'deploy/release/assemble_release.py'
      - 'deploy/standalone/package.py'
      - 'prototypes/lp4-execution/contracts/system/PoColSystemV3.sol'
      - 'prototypes/pocold/src/readiness.rs'
      - 'prototypes/lp4-execution/src/admission/scope.rs'
      - 'prototypes/pocol-windows/**'
      - 'prototypes/pocol-android/app/src/main/**'
      - '**/config.php'
      - '.gitignore'
      - '.github/workflows/websites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: No config.php is tracked
        run: |
          set -euo pipefail
          # Host credentials (pocol.net's and any api/config.php) stay on the host; the file is never read here. The
          # explorer snapshot has no api/ since Sites W8; the ignore rule still covers that path as a defence.
          if git ls-files | grep -iE '(^|/)config\.php$'; then
            echo 'a config.php is tracked: remove it from the repository (it holds host credentials)' >&2
            exit 1
          fi
          git check-ignore -q --no-index deploy/websites/explorer.pocol.net/api/config.php
      - name: Website identity, derived files, retired identities, origins and download links
        run: python3 -B deploy/websites/tools/site_identity.py --check
      - name: Website tool tests, the static explorer snapshot, the config.php guards and the explorer refresh size (W7)
        run: python3 -B -m unittest discover -s deploy/websites/tests -p 'test_*.py' -v
      - name: Explorer v3 membership edits (W7) and their helpers in node:vm
        run: node --test deploy/websites/tests/explorer_w7.test.mjs
      - name: Explorer gateway /api reads (the retired PHP relays' checks, every handler, the recorded PHP vectors)
        run: python3 -B -m unittest discover -s deploy/rewards -p test_explorer_api.py -v
      - name: Explorer gateway host (Caddy site with the Studio and faucet routes, static copy, installer and rollback)
        run: python3 -B -m unittest discover -s deploy/explorer -v
      - name: Fee faucet (error codes, CORS, client key) and its /faucet/* Caddy route
        run: python3 -B -m unittest discover -s deploy/faucet -v
      - name: Use the official Ubuntu archive
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - name: PHP request, response and cache checks (pocol.net)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl
          php deploy/websites/tests/api_security.php
      - name: Studio gateway
        run: python3 -B -m unittest discover -s deploy/studio -v
      - name: Studio site
        run: |
          npm test
          npm run check
        working-directory: prototypes/pocol-studio
      - name: Install the browser
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "POCOL_CHROMIUM=$(node --input-type=module -e "const {chromium}=await import('$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs');console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Browser checks of the four sites (all requests outside each local origin aborted)
        run: node deploy/websites/tests/browser_security.mjs
      - name: Explorer W7 Overview against a fake relay (a refused transaction read, the map's members page)
        run: node deploy/websites/tests/explorer_w7_browser.mjs
