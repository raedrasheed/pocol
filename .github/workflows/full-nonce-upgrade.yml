name: Consensus rules, profiles and extension release
on:
  pull_request:
    branches: [main]
    paths: ['prototypes/**', 'deploy/standalone/**', 'deploy/rewards/**', 'deploy/mainnet/**', 'deploy/public-testnet/**', 'deploy/studio/**', 'deploy/faucet/**', 'deploy/rehearsal/**', 'deploy/release/**', 'README.md', 'development/decisions/FRESH-NETWORK-CP.md', '.github/workflows/full-nonce-upgrade.yml']
  # After a merge too: this is the only run of test_upgrade.py (same-release fork appends and the move to another
  # genesis with the key kept).
  push:
    branches: [main]
    paths: ['prototypes/**', 'deploy/standalone/**', 'deploy/rewards/**', 'deploy/mainnet/**', 'deploy/public-testnet/**', 'deploy/studio/**', 'deploy/faucet/**', 'deploy/rehearsal/**', 'deploy/release/**', 'README.md', 'development/decisions/FRESH-NETWORK-CP.md', '.github/workflows/full-nonce-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consensus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # origin/main for the consensus lock's append-only check.
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Consensus lock is append-only against main
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s deploy/ci -v
          python3 -B deploy/ci/check_lock_append_only.py --base origin/main
      - name: Test profiles, activation, persistence and native binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --manifest-path prototypes/lp1-node/Cargo.toml --test profile --test gate --test assignment
          cargo +1.99.1 test --locked --manifest-path prototypes/lp4-execution/Cargo.toml --test profile_execution
          cargo +1.99.1 test --locked --release --manifest-path prototypes/pocold/Cargo.toml --lib --test nonce_domain --test fork_configuration --test consensus_guard --test decoder_reference --test fn1_membership --test fn1_caps --test fn1b_derivation --test fn3_members --test fn3_scale
          cargo +1.99.1 build --locked --release --bins --manifest-path prototypes/pocold/Cargo.toml
          python deploy/standalone/test_launcher.py -v
          python deploy/standalone/test_upgrade.py -v
          python -m unittest discover -s deploy/rewards -v
      - name: Test the rehearsal's registration fill harness (M1, M3) on a local devnet
        if: runner.os == 'Linux'
        env:
          # The devnet test (fill to M_max 8, then M3) runs on the binaries built above, about 1 to 2 minutes.
          POCOL_REHEARSAL_E2E: '1'
        run: python3 -B -m unittest discover -s deploy/rehearsal -p 'test_*.py' -v
      - name: Check shared decoder and profile copies
        if: runner.os == 'Linux'
        run: |
          cmp prototypes/lp1-node/src/genesis_spec.rs prototypes/lp4-execution/src/p1_genesis_spec.rs
          cmp prototypes/lp1-node/src/profile.rs prototypes/lp4-execution/src/p1_profile.rs
      - name: Test the v3 release rules (spec 2 by default, consensus rules 2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --release --locked --manifest-path prototypes/lp1-node/Cargo.toml --lib
          cargo +1.99.1 test --release --locked --manifest-path prototypes/lp4-execution/Cargo.toml --lib
          cargo +1.99.1 test --release --locked --manifest-path prototypes/pocold/Cargo.toml --test v3_scaffold --test v3_membership --test v3_fork_choice --test v3_execution
          # FN-4: the fresh network's committed profiles (deploy/mainnet/v3-profile.json, v3-rehearsal-profile.json).
          cargo +1.99.1 test --release --locked --manifest-path prototypes/pocold/Cargo.toml --test fn4_profiles --test launch_delay_asert
          # V3-PR-G: the reward gateway (deploy/rewards V3DevnetDifferential) against a v3 chain served over pocold's RPC.
          cargo +1.99.1 test --release --locked --manifest-path prototypes/pocold/Cargo.toml --test v3_reward_gateway
          python3 -B -m unittest discover -s deploy/standalone -p test_release_package.py -v
      - name: Test the caps-test feature gate, the network identity tool, Studio gateway and faucet
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # T9: lp4's caps-test without pocold's own feature must not compile (identity flag source, A1-3).
          if cargo +1.99.1 check --locked --release --lib --manifest-path prototypes/pocold/Cargo.toml --features pocol-lp4-execution/caps-test 2> "$RUNNER_TEMP/caps-only.log"; then
            echo 'pocol-lp4-execution/caps-test alone must fail to compile' >&2; exit 1
          fi
          grep -F "enable caps-test through pocold's feature" "$RUNNER_TEMP/caps-only.log"
          python3 -B -m unittest discover -s deploy/mainnet -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/studio -v
          python3 -B -m unittest discover -s deploy/faucet -v
  caps-test:
    # validation.md:2065 caps-test build (LOG_CAP = 2^24, simnet only): the targets gated on the feature
    # (log_cap, log_cap_scope) and the ones whose expectations follow it, so they cannot rot unnoticed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test the caps-test build
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --release --locked --manifest-path prototypes/lp4-execution/Cargo.toml --features caps-test --lib --test caps_identity -- --test-threads=1
          cargo +1.99.1 test --release --locked --manifest-path prototypes/pocold/Cargo.toml --features caps-test --lib --test log_cap --test log_cap_scope --test caps --test fn1_caps --test consensus_guard --test v3_scaffold --test net -- --test-threads=1
  browser:
    # The job id stays `browser`; its check name is this name (no branch protection pins either).
    name: Extension release (Studio, IDE, Viewer)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Linux wallet export dependency
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
      - name: Verify complete Studio, IDE and Viewer release
        run: |
          npm ci --ignore-scripts
          npm test
          npm run test:studio
          npm run test:publisher
          npm run test:publisher-ui
          npm run test:contracts
          npm run test:contract-ui
          /usr/bin/python3 -m unittest tests/test_linux_export.py -v
          if grep -q NETWORK_PLACEHOLDER src/lib/studio-network.js; then
            # D1: the built-in profile is the network placeholder until the identity switch; no release is packaged.
            npm run build
            if python3 scripts/package-release.py "$RUNNER_TEMP/placeholder.zip" 2> "$RUNNER_TEMP/package.log"; then
              echo 'the release packager must refuse the placeholder build' >&2; exit 1
            fi
            grep -F 'network placeholder' "$RUNNER_TEMP/package.log"
          else
            # After the identity switch the release carries the owner's manifest key (release/manifest-key.pub, W14,
            # committed 2026-11-18), so the packager packages it with the fixed extension id.
            npm run package
            # The packaged zip is unsigned until the owner signs it (deploy/release): it must not verify.
            if python3 -B ../../deploy/release/verify_release.py releases > "$RUNNER_TEMP/verify.log"; then
              echo 'an unsigned extension release must not verify' >&2; exit 1
            fi
            grep -F 'NOT VERIFIED' "$RUNNER_TEMP/verify.log"
          fi
        working-directory: prototypes/pocol-extension
      - name: Verify Studio
        run: |
          npm test
          npm run check
        working-directory: prototypes/pocol-studio
      - name: Upload extension release
        # No release exists while the built-in profile is the placeholder (D1).
        if: hashFiles('prototypes/pocol-extension/releases/*.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocol-extension-${{ github.sha }}
          path: prototypes/pocol-extension/releases/*
          if-no-files-found: error
  extension-reproducible:
    # W14 double build: two fresh checkouts at different paths, on the same image (zlib output can differ between
    # images), with other umasks, time zones and source mtimes. Each uploads the sorted sha256 list of dist/, the hash of
    # write_release_zip over that dist/ (the placeholder build: only its .sha256 is kept, it is no release), and, once the
    # identity switch removes the network placeholder, the packaged release zip's .sha256. The compare job fails on any
    # difference.
    name: Extension double build (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: a
            path: a
            umask: '0022'
            tz: UTC
          - leg: b
            path: other/deeper/checkout-b
            umask: '0077'
            tz: Pacific/Kiritimati
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: ${{ matrix.path }}
      - name: Build dist/ and hash it
        shell: bash
        env:
          TZ: ${{ matrix.tz }}
          LEG: ${{ matrix.leg }}
          UMASK: ${{ matrix.umask }}
          OUT: ${{ runner.temp }}/extension-reproducible
        working-directory: ${{ matrix.path }}/prototypes/pocol-extension
        run: |
          set -euo pipefail
          umask "$UMASK"
          if [ "$LEG" = b ]; then
            # Other source mtimes, set in reverse order of name.
            git ls-files -z | LC_ALL=C sort -rz | xargs -0 touch -d '2001-02-03 04:05:06 UTC'
          fi
          mkdir -p "$OUT" "$RUNNER_TEMP/zip-writer"
          { echo "image ${ImageOS:-?} ${ImageVersion:-?}"; node --version; python3 -B -c 'import sys, zlib; print(sys.version.split()[0], "zlib", zlib.ZLIB_RUNTIME_VERSION)'; } > "$OUT/env.txt"
          npm ci --ignore-scripts
          node build.mjs
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$OUT/dist.sha256"
          test -s "$OUT/dist.sha256"
          python3 -B -c 'import importlib.util, sys; s = importlib.util.spec_from_file_location("p", "scripts/package-release.py"); m = importlib.util.module_from_spec(s); s.loader.exec_module(m); m.write_release_zip(m.Path("dist"), m.Path(sys.argv[1]))' "$RUNNER_TEMP/zip-writer/dist.zip"
          cp "$RUNNER_TEMP/zip-writer/dist.zip.sha256" "$OUT/dist-zip.sha256"
          if ! grep -q NETWORK_PLACEHOLDER src/lib/studio-network.js; then
            # After the identity switch: the release zip itself (the packager's checks included).
            version=$(node -p 'require("./package.json").version')
            python3 -B scripts/package-release.py "$RUNNER_TEMP/release/PoCol-Studio-IDE-Viewer-$version.zip"
            cp "$RUNNER_TEMP/release/PoCol-Studio-IDE-Viewer-$version.zip.sha256" "$OUT/release-zip.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-reproducible-${{ matrix.leg }}
          path: ${{ runner.temp }}/extension-reproducible
          if-no-files-found: error
  extension-reproducible-compare:
    name: Extension double build compare
    needs: extension-reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-reproducible-a
          path: repro/a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-reproducible-b
          path: repro/b
      - name: The two builds must be byte-identical
        shell: bash
        run: |
          set -euo pipefail
          for leg in a b; do echo "leg $leg:"; cat "repro/$leg/env.txt"; test -s "repro/$leg/dist.sha256"; test -s "repro/$leg/dist-zip.sha256"; done
          if ! diff -r -x env.txt repro/a repro/b; then
            echo 'the two extension builds differ (if env.txt above differs too, the legs ran on different images)' >&2; exit 1
          fi
          echo "identical: $(wc -l < repro/a/dist.sha256) dist/ files; zip writer $(cut -d' ' -f1 repro/a/dist-zip.sha256)"
