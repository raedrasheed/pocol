name: PoCol Mainnet native release packages
on:
  pull_request:
    branches: [main]
    paths: ['prototypes/**', 'deploy/standalone/**', 'deploy/mainnet/v3-*profile.json', 'deploy/mainnet/retired-networks.json', 'deploy/mainnet/README.md', 'development/decisions/FRESH-NETWORK-CP.md', 'development/public-network/REHEARSAL.md', 'development/public-network/OPERATIONS.md', 'deploy/release/**', 'deploy/public-testnet/pocol_identity.py', '.github/workflows/five-device-build.yml']
  push:
    branches: [main]
    paths: ['prototypes/**', 'deploy/standalone/**', 'deploy/mainnet/v3-*profile.json', 'deploy/mainnet/retired-networks.json', 'deploy/mainnet/README.md', 'development/decisions/FRESH-NETWORK-CP.md', 'development/public-network/REHEARSAL.md', 'development/public-network/OPERATIONS.md', 'deploy/release/**', 'deploy/public-testnet/pocol_identity.py', '.github/workflows/five-device-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # The Linux job also builds the three copies of the mixed-build interop test.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve identical source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
          # origin/main for the consensus lock's append-only check.
          fetch-depth: 0
      - name: Read the release version (deploy/standalone/package.py, its only definition)
        shell: bash
        run: echo "POCOL_VERSION=$(python deploy/standalone/package.py --version | tr -d '\r')" >> "$GITHUB_ENV"
      - name: Consensus lock is append-only against main
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s deploy/ci -v
          python3 -B deploy/ci/check_lock_append_only.py --base origin/main
      - name: Validate Windows setup script syntax without accessing any server
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/standalone/Initialize-PoColNetwork.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax errors' }
      - name: Keep the Windows package independent of the Visual C++ redistributable
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build native Windows wallet and render its actual WPF interface
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/standalone/build-windows-wallet.ps1
      - name: Build native binaries
        shell: bash
        env:
          # Release packaging: build.rs refuses a tree whose consensus sources are not pinned (plan §1.5).
          POCOL_RELEASE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal
          python development/security-evm-crypto-2026-11-05/verify_vendor.py
          cargo +1.99.1 build --locked --release --bins --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 metadata --locked --format-version 1 --manifest-path prototypes/pocold/Cargo.toml > "$RUNNER_TEMP/pocol-crypto-metadata.json"
          python development/security-evm-crypto-2026-11-05/verify_crypto_graph.py --metadata "$RUNNER_TEMP/pocol-crypto-metadata.json"
          cargo +1.99.1 test --locked --release --test signing_compat --test evm_numeric_edges --manifest-path prototypes/lp4-execution/Cargo.toml
          cargo +1.99.1 test --locked --release --lib --test net --test cli --test key_credential --test discovery --test outbound_threads --test consensus_guard --manifest-path prototypes/pocold/Cargo.toml
          if [ "$RUNNER_OS" = Linux ]; then
            # T9: lp4's caps-test without pocold's own feature must not compile (identity flag source, A1-3).
            if cargo +1.99.1 check --locked --release --lib --manifest-path prototypes/pocold/Cargo.toml --features pocol-lp4-execution/caps-test 2> "$RUNNER_TEMP/caps-only.log"; then
              echo 'pocol-lp4-execution/caps-test alone must fail to compile' >&2; exit 1
            fi
            grep -F "enable caps-test through pocold's feature" "$RUNNER_TEMP/caps-only.log"
          fi
          python deploy/standalone/test_launcher.py -v
          # K1: encrypt-server-key.sh's refusals, rollback and success path, against fakes (bash; Linux only).
          if [ "$RUNNER_OS" = Linux ]; then python deploy/standalone/test_encrypt_server_key.py -v; fi
          python deploy/standalone/test_initialize_network.py -v
          python deploy/standalone/test_launcher.py --integration
          python deploy/standalone/test_wallet.py
          cargo +1.99.1 test --locked --release --test consensus continuous_admission --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 test --locked --release --test consensus final_ --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 test --locked --release --lib --manifest-path prototypes/lp4-execution/Cargo.toml
      - name: Consensus identity input (a fixed throwaway genesis on the mainnet chain; never a launch genesis)
        shell: bash
        run: |
          set -euo pipefail
          python deploy/release/test_compare_build_identity.py -v
          python deploy/release/compare_build_identity.py genesis --bin-dir prototypes/pocold/target/release --out "$RUNNER_TEMP/consensus-identity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: consensus-identity-${{ runner.os }}-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/consensus-identity
          if-no-files-found: error
          retention-days: 30
      - name: Genesis ceremony dry run (FN-7) admits the committed profiles, without contacting any server
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/standalone/test_initialize_network.ps1
      - name: Package explicit public allowlist
        shell: bash
        run: |
          python deploy/standalone/test_release_package.py -v
          python deploy/standalone/package.py --platform "${{ runner.os }}" --out dist
      - name: Release signing tools; an unsigned package never verifies (owner decision 2026-11-16)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/release/test_release_signing.py -v
          python3 -B deploy/release/test_double_build.py -v
          # The CI package carries no release signature: the verifier must say NOT VERIFIED, never VERIFIED.
          if python3 -B deploy/release/verify_release.py dist > "$RUNNER_TEMP/verify.log"; then
            echo 'an unsigned release must not verify' >&2; exit 1
          fi
          grep -F 'NOT VERIFIED' "$RUNNER_TEMP/verify.log"
      - name: Release signing tools on Windows (throwaway keys)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/release/test_verify_release.ps1
      - name: Mixed-build interop (builds with other digests peer, other rules and unpinned trees do not)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Plan T35/T10: A is this tree (already built above); B, C and D are built from one copy with their own
          # CARGO_TARGET_DIR under RUNNER_TEMP, so this tree's packaged binaries are never touched.
          TMPDIR="$RUNNER_TEMP" python3 -B prototypes/pocold/tests/e2e_mixed_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PoCol-Mainnet-${{ env.POCOL_VERSION }}-${{ runner.os }}-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Read the release version (deploy/standalone/package.py, its only definition)
        shell: bash
        run: echo "POCOL_VERSION=$(python deploy/standalone/package.py --version | tr -d '\r')" >> "$GITHUB_ENV"
      - name: Set up fixed toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          curl --fail --location --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          curl --fail --location --output "$RUNNER_TEMP/gradle.sha256" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build actual ARM64 engine and unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash deploy/standalone/build-android.sh
          apk=prototypes/pocol-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo 'The release stays unsigned until the owner signs it with the release key.' >&2
            exit 1
          fi
          python deploy/standalone/package.py --platform Android --out dist
          # The one application id: the APK's id, versionCode and versionName are the ones release-info states (read
          # from build.gradle), and its launcher label is PoCol Wallet.
          expected=$(python -c "import json; r=json.load(open('dist/release-info.json')); print(f\"package: name='{r['applicationId']}' versionCode='{r['versionCode']}' versionName='{r['version']}'\")")
          case "$expected" in "package: name='org.pocol.wallet' "*) ;; *) echo "unexpected application: $expected" >&2; exit 1 ;; esac
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "$expected"
          printf '%s\n' "$badging" | grep -F "application-label:'PoCol Wallet'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PoCol-Mainnet-${{ env.POCOL_VERSION }}-Android-arm64-UNSIGNED-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
      # The engine's raw build identity (build.rs) for the cross-platform consensus identity compare.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: consensus-identity-Android-${{ env.EXPECTED_COMMIT }}
          path: dist/build-info.json
          if-no-files-found: error
          retention-days: 30
  consensus-identity-compare:
    # Device compatibility (OWNER-DECISIONS-2026-11-20 D6 E): the Linux and Windows binaries built the same genesis bytes
    # from fixed inputs on the mainnet chain, and the Linux, Windows and Android builds agree on every field the consensus
    # identity and the handshake read, on the build digest, and on the identity they would send on that genesis
    # (deploy/release/compare_build_identity.py). The Android engine does not run here: its identity is computed from
    # the build identity its APK's engine was compiled with.
    name: Linux, Windows and Android consensus identity compare
    needs: [native, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consensus-identity-Linux-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/identity/Linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consensus-identity-Windows-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/identity/Windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consensus-identity-Android-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/identity/Android
      - name: The three builds agree on the consensus identity
        shell: bash
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/identity"
          python3 -B deploy/release/compare_build_identity.py compare --genesis "Linux=$t/Linux" --genesis "Windows=$t/Windows" \
            --build "Linux=$t/Linux/build-info.json" --build "Windows=$t/Windows/build-info.json" --build "Android=$t/Android/build-info.json"
  native-reproducible:
    # Gate I1 (d): the Linux release binaries and package built twice, from other checkout paths, umasks, TZ, locales,
    # cargo homes and source mtimes, under the recipe of deploy/release/double_build.py (one fixed build path, remapped
    # compiler paths, SOURCE_DATE_EPOCH from the commit, toolchain 1.99.1 --locked). The compare job fails on any
    # difference. The Windows wallet and the APK are not part of this check.
    name: Native double build (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: a
            path: a
            umask: '0022'
            tz: UTC
            lc_all: C
          - leg: b
            path: other/deeper/checkout-b
            umask: '0077'
            tz: Pacific/Kiritimati
            lc_all: C.UTF-8
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
          path: ${{ matrix.path }}
      - name: Build the Linux release binaries and package, and hash them
        shell: bash
        working-directory: ${{ matrix.path }}
        env:
          TZ: ${{ matrix.tz }}
          LC_ALL: ${{ matrix.lc_all }}
          LEG: ${{ matrix.leg }}
          UMASK: ${{ matrix.umask }}
          OUT: ${{ runner.temp }}/native-reproducible
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal
          umask "$UMASK"
          if [ "$LEG" = b ]; then
            # Other source mtimes (set in reverse name order) and modes, and another cargo home (the registry is
            # fetched again, under another path; Cargo.lock's checksums pin its bytes).
            git ls-files -z | LC_ALL=C sort -rz | xargs -0 touch -d '2001-02-03 04:05:06 UTC'
            chmod -R go-rwx .
            export CARGO_HOME="$RUNNER_TEMP/cargo-home-b"
          fi
          python3 -B deploy/release/double_build.py build --leg "$LEG" --out "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-reproducible-${{ matrix.leg }}
          path: ${{ runner.temp }}/native-reproducible
          if-no-files-found: error
          retention-days: 30
  native-reproducible-compare:
    name: Native double build compare
    # The comparison runs whenever both legs finished, so its verdict is shown even when a native job fails; the
    # package to sign is uploaded only when the native jobs passed too (Linux and Windows; on Linux the vendor and
    # crypto-graph checks, the consensus-lock check, the test suites, the release-package tests, the
    # unsigned-must-not-verify and mixed-build checks).
    needs: [native, native-reproducible]
    if: ${{ !cancelled() && needs.native-reproducible.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-reproducible-a
          path: ${{ runner.temp }}/repro/a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-reproducible-b
          path: ${{ runner.temp }}/repro/b
      - name: The two builds must be byte-identical
        id: compare
        shell: bash
        run: python3 -B deploy/release/double_build.py compare --no-diffoscope "$RUNNER_TEMP/repro/a" "$RUNNER_TEMP/repro/b"
      - name: Explain the difference with diffoscope
        if: failure() && steps.compare.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends diffoscope-minimal
          python3 -B deploy/release/double_build.py compare "$RUNNER_TEMP/repro/a" "$RUNNER_TEMP/repro/b" || true
          exit 1
      - name: Read the release version (deploy/standalone/package.py, its only definition)
        shell: bash
        run: echo "POCOL_VERSION=$(python3 deploy/standalone/package.py --version | tr -d '\r')" >> "$GITHUB_ENV"
      # The Linux package both builds agree on: the one to sign (deploy/release/README.md, owner procedure step 3).
      # compare checked that repro/a/dist holds exactly the archive whose SHA-256 both legs listed, and its SHA256SUMS.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ success() && needs.native.result == 'success' }}
        with:
          name: PoCol-Mainnet-${{ env.POCOL_VERSION }}-Linux-reproducible-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/repro/a/dist/
          if-no-files-found: error
          retention-days: 30
