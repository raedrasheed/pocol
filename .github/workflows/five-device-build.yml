name: PoCol Mainnet 0.4.0 native release packages
on:
  pull_request:
    branches: [main, codex/public-network-operations, work/branding-20261031]
    paths: ['prototypes/**', 'deploy/standalone/**', '.github/workflows/five-device-build.yml']
  push:
    branches: [main]
    paths: ['prototypes/**', 'deploy/standalone/**', '.github/workflows/five-device-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # The Linux job also builds the three copies of the mixed-build interop test.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve identical source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
          # origin/main for the consensus lock's append-only check.
          fetch-depth: 0
      - name: Consensus lock is append-only against main
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s deploy/ci -v
          python3 -B deploy/ci/check_lock_append_only.py --base origin/main
      - name: Validate Windows setup script syntax without accessing any server
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/standalone/Initialize-PoColNetwork.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax errors' }
      - name: Keep the Windows package independent of the Visual C++ redistributable
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build native Windows wallet and render its actual WPF interface
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/standalone/build-windows-wallet.ps1
      - name: Build native binaries
        shell: bash
        env:
          # Release packaging: build.rs refuses a tree whose consensus sources are not pinned (plan §1.5).
          POCOL_RELEASE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal
          python development/security-evm-crypto-2026-11-05/verify_vendor.py
          cargo +1.99.1 build --locked --release --bins --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 metadata --locked --format-version 1 --manifest-path prototypes/pocold/Cargo.toml > "$RUNNER_TEMP/pocol-crypto-metadata.json"
          python development/security-evm-crypto-2026-11-05/verify_crypto_graph.py --metadata "$RUNNER_TEMP/pocol-crypto-metadata.json"
          cargo +1.99.1 test --locked --release --test signing_compat --test evm_numeric_edges --manifest-path prototypes/lp4-execution/Cargo.toml
          cargo +1.99.1 test --locked --release --lib --test net --test cli --test cutover --test discovery --test outbound_threads --test consensus_guard --manifest-path prototypes/pocold/Cargo.toml
          if [ "$RUNNER_OS" = Linux ]; then
            # T9: lp4's caps-test without pocold's own feature must not compile (identity flag source, A1-3).
            if cargo +1.99.1 check --locked --release --lib --manifest-path prototypes/pocold/Cargo.toml --features pocol-lp4-execution/caps-test 2> "$RUNNER_TEMP/caps-only.log"; then
              echo 'pocol-lp4-execution/caps-test alone must fail to compile' >&2; exit 1
            fi
            grep -F "enable caps-test through pocold's feature" "$RUNNER_TEMP/caps-only.log"
          fi
          python deploy/standalone/test_launcher.py -v
          python deploy/standalone/test_upgrade.py -v
          python deploy/standalone/test_launcher.py --integration
          python deploy/standalone/test_wallet.py
          cargo +1.99.1 test --locked --release --test consensus continuous_admission --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 test --locked --release --test consensus final_ --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 test --locked --release --lib --manifest-path prototypes/lp4-execution/Cargo.toml
      - name: Package explicit public allowlist
        shell: bash
        run: |
          python deploy/standalone/test_release_package.py -v
          python deploy/standalone/package.py --platform "${{ runner.os }}" --out dist
      - name: Mixed-build interop (builds with other digests peer, other rules and unpinned trees do not)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Plan T35/T10: A is this tree (already built above); B, C and D are built from one copy with their own
          # CARGO_TARGET_DIR under RUNNER_TEMP, so this tree's packaged binaries are never touched.
          TMPDIR="$RUNNER_TEMP" python3 -B prototypes/pocold/tests/e2e_mixed_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PoCol-Mainnet-0.4.0-${{ runner.os }}-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Set up fixed toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          curl --fail --location --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          curl --fail --location --output "$RUNNER_TEMP/gradle.sha256" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build actual ARM64 engine and unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash deploy/standalone/build-android.sh
          apk=prototypes/pocol-android/app/build/outputs/apk/release/app-release-unsigned.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='org.pocol.node' versionCode='5' versionName='0.4.0'"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo 'Release must remain unsigned until the existing app signer is supplied.' >&2
            exit 1
          fi
          python deploy/standalone/package.py --platform Android --out dist
      - name: Build the new-key app under its own application id (V3-33)
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # A build for a new signing key cannot update org.pocol.node; it is another app that installs beside it.
          gradle --no-daemon -p prototypes/pocol-android assembleRelease -PpocolApplicationId=org.pocol.wallet
          apk=prototypes/pocol-android/app/build/outputs/apk/release/app-release-unsigned.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='org.pocol.wallet' versionCode='5' versionName='0.4.0'"
          printf '%s\n' "$badging" | grep -F "application-label:'PoCol Wallet (new)'"
          if gradle --no-daemon -q -p prototypes/pocol-android help -PpocolApplicationId=Not.A.Package; then
            echo 'An invalid application id must be refused.' >&2
            exit 1
          fi
          python deploy/standalone/package.py --platform Android --android-application-id org.pocol.wallet --out dist-wallet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PoCol-Mainnet-0.4.0-Android-arm64-UNSIGNED-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PoCol-Wallet-0.4.0-Android-arm64-org.pocol.wallet-UNSIGNED-${{ env.EXPECTED_COMMIT }}
          path: dist-wallet/
          retention-days: 30
