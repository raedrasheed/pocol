name: Security owner evidence tools and Android probe
on:
  pull_request:
    branches: [main]
    paths:
      - 'development/security-codeql-main-2026-11-06/**'
      - 'development/security-codeql-remaining-2026-11-07/**'
      - 'development/security-evm-crypto-2026-11-05/apply*codeql.py'
      - 'development/security-evm-crypto-2026-11-05/reviewed*codeql*.json'
      # The JNI boundary and the wallet texts it shares with the Windows wallet (deploy/standalone/test_android_jni.py).
      - 'deploy/standalone/test_android_jni.py'
      - 'prototypes/pocol-android/app/src/main/cpp/**'
      - 'prototypes/pocol-android/app/src/main/java/**'
      - 'prototypes/pocol-windows/Wallet.cs'
      - '.github/workflows/security-owner-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: security-owner-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-collector:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
    steps:
      - name: Preserve reviewed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          # The collector test reads the reviewed rows' blobs at the pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Test the owner collector on Windows without calling GitHub
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_COMMIT) { throw 'Unexpected source commit' }
          python -m unittest discover -s development/security-codeql-main-2026-11-06 -p test_collect_main_codeql.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows collector tests failed' }
      - name: Test USB and explicit wireless device selection without a phone
        working-directory: development/security-codeql-main-2026-11-06
        shell: powershell
        run: |
          python -m unittest test_device_probe.DeviceGuards -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows device guard tests failed' }
      - name: Test reviewed main CodeQL batch without GitHub writes
        shell: powershell
        run: |
          python -m unittest discover -s development/security-evm-crypto-2026-11-05 -p test_apply_reviewed_codeql.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows main batch tests failed' }
      - name: Test remaining 19 findings and final inventory without GitHub writes
        shell: powershell
        run: |
          python -m unittest discover -s development/security-codeql-remaining-2026-11-07 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows remaining findings tests failed' }
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify read-only CodeQL collection and device harness safeguards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          export POCOL_TEST_JAVA_HOME="$JAVA_HOME_17_X64"
          python3 -m unittest discover -s development/security-codeql-main-2026-11-06 -p 'test_*.py' -v
          python3 -m unittest discover -s development/security-evm-crypto-2026-11-05 -p 'test_apply*codeql.py' -v
          python3 -m unittest discover -s development/security-codeql-remaining-2026-11-07 -p 'test_*.py' -v
          python3 deploy/standalone/test_android_jni.py -v
