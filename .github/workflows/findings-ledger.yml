# Gate Q1's unresolved-finding ledger (development/public-network/FINDINGS.md): its links, cited paths and line bounds,
# its F-NN ids and its launch wording (deploy/websites/tests/test_launch_decisions.py, class FindingsLedger). The ledger
# cites files across the repository, so this runs on every push and pull request to main, with no paths filter, and
# once a week; a change that removes, renames or shortens a cited file fails here.
name: Findings ledger
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  findings-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: FINDINGS.md links, cited paths and lines, ids and launch wording
        run: python3 -B -m unittest deploy.websites.tests.test_launch_decisions.FindingsLedger -v
