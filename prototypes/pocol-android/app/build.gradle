plugins { id 'com.android.application' }
android {
    // The Java package (and so the JNI symbols bridge.c exports) stays org.pocol.node; only the installed
    // application id is org.pocol.wallet.
    namespace 'org.pocol.node'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pocol.wallet'
        minSdk 26; targetSdk 35; versionCode 6; versionName '0.5.0'; ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
