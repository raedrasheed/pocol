history n=21 kind=neutral-vector rules=1 maxFork=2 spec=1 protocol=2 protocolMin=2 sources=1c2159f9536bd2abc7d957a954b5ae9956592566bb4f8ce8ccd43c8cffa415fc vectors=8fa8f508a981765b9eb727d3d0d5e54c68c74a4d24813481f201a30547f5e76e deps=0a6c309c55cb472af73bd88fb8f29ae5ad5b36f8a9edcbf574ece6ae84b28fa3 wire=75f4d0a4ef8d9107175def6fbb7f702271266f1040904417c9bc4f068a574f51 ref=V3-PR-E2a note="spec:2-dormant (the guard refuses a gate on neutral-vector): V3-PR-E2a re-pinned on the updated V3-PR-E3 (main, V3-PR-E2b): v3 issuance M3, carry and tip split V3-19/V3-15/V3-20 in system-v3.json (PoColSystemV3.sol RewardEscrow: closeBlock(tips, issued) records issued + (1 - gamma_tip)*tips + carry and pays the signed proposer's tip share through payTo, none on a fallback; D-V3-15 carry lagged by one block: settle in block h adds its base burn to the carry into pot h+1 at slot 4+((h+1)&1), closeBlock(h) drains the carry into pot h at slot 4+(h&1), finalize burns both outstanding carries; roundBurn still burns) and the host side, taken only on the v3 program set: lp4-execution issuance.rs issuance(h) = max(k>=256?0:S0>>k, S_tail), k = h/H_half, credited in apply.rs phase 2, check_escrow_invariant counting both carries and refusing a carry into pot h after phase 2, a carry into pot h+1 before any settlement (h<=D) and any carry after a final block; genesis_builder supply bound allocations + bonds + 2*S0*H_half + S_tail*2^64 < 2^127; IdentityFacts.m3_issuance set from the v3 sysCodeHash so ParamGate R23 takes the M3 supply term only for the v3 set; resources.rs R18 counts one more Escrow slot, two carry keys and the tip share's keys and account on CP schema v2; admission's GAS_ENVELOPE_V3 gains closeBlock 133,000 (132,825 measured: the tip share promotes an ACCRUING proposer while held_total goes from zero to nonzero) and finalize 62,000 (61,932 measured: two carries burned as the chain's first burn), which replace the earn-in entries in the GAS_ENVELOPE_V3-over-GAS_ENVELOPE_EARNIN composition only for that set, with the R18 condition naming the v3 finalize measurement; vectors regenerated (issuance-carry, evidence-penalty, late-share); reachable only via the v3 sysCodeHash on a specVersion-2 genesis (CP schema v2), which SPEC_VERSION=1 builds refuse; system-v1/continuous/earnin.json, their sysCodeHashes, CP 15 issuance and closeBlock(tips) of the spec-1 sets, GAS_ENVELOPE, GAS_ENVELOPE_EARNIN, the V1/Continuous/EarnIn admission facts (H15000 included) and every spec-1 verdict and root unchanged (re-pinned on main after V3-PR-E3)"
history n=22 kind=neutral-vector rules=1 maxFork=2 spec=1 protocol=2 protocolMin=2 sources=ed399449584bec9f852b2f15161fa77fe3e8c14bb56d15354428bdd0b3047f50 vectors=93a356d8ba9faf6db7d7608a77ccff322855443d4e19dceebcd575047f96eaa4 deps=0a6c309c55cb472af73bd88fb8f29ae5ad5b36f8a9edcbf574ece6ae84b28fa3 wire=75f4d0a4ef8d9107175def6fbb7f702271266f1040904417c9bc4f068a574f51 ref=V3-PR-E4 note="spec:2-dormant (the guard refuses a gate on neutral-vector): V3-PR-E4 (with its review fixes and the owner decision of 2026-11-13 on the pool-contest victim, option a) re-pinned on the updated V3-PR-E2a (main, V3-PR-E2b, V3-PR-E3): v3 contestable seats and probation-pool contest V3-10/V3-14 in system-v3.json (PoColSystemV3.sol MinerRegistry: per-record epoch counters countCur/countPrev in w0 bits 216..255 for the template epoch j/E_epoch, raised by recordShares and recordLate, epoch totals in slot 10; registerContest(reward, victim) with two REG_OPS units and one R_max entry: a full set (active == M_max; code 2 otherwise) and a live active victim past grace, registered or reactivated at or before the first block of the measured previous epoch, judged once its late window closed, with count < E - k_sigma*sqrt(E), E = theta*Tprev/active (always M_max), decided exactly with an integer square root, exits the victim as by deregister with its refund after U; a probationer newcomer facing a full pool (ACC_COUNT >= P_MAX) on a full set displaces an ACCRUING victim the same way: owner decision 2026-11-13 (option a), the victim stays exited, payable (its parts of pending pots fill its accrued bond) and punishable until dueHeight and gives up its pool seat at once, marked POOL_OUT (w0 bit 87), so ACC_COUNT counts only the ACCRUING records holding a pool seat: lowered once at the contest, never again at its refund, punish or promotion, and reactivate takes a pool seat again (Capacity when full); V3-08 lastMaintHeight moved to w1 bits 224..255 mod 2^32; views contestStatus, contestThreshold, epochTotals); resources.rs counts the epoch totals slot and key on CP schema v2; admission GAS_ENVELOPE_V3 gains recordShares 14,389,000 (14,388,687 measured) and markClose 2,735,000 (2,734,171 measured before the decision, 2,732,250 after), each above the earn-in entry it replaces (13,216,000 and 2,716,000) in the GAS_ENVELOPE_V3-over-GAS_ENVELOPE_EARNIN composition, re-measures recordLate 3,466,000 and takes settle/settleFinal 6,317,000 (6,316,532 measured: promote tests POOL_OUT on each of the worst path 64 promotions), only for that set; vectors regenerated (registry-budget, earn-in-on-v3, evidence-penalty, late-share, issuance-carry gain the counters; contest-vectors new, with pool contests on a full set, exits that cannot raise the threshold, the pool victim kept exited: pending pots filling its bond, refunded at due, promoted, punished after the contest, reactivating only into a free pool seat, the newcomer seated at once; seat victims punished before their due height; the review of the decision adds a victim promoted to HELD while exited that reactivates without taking a pool seat, and the model's per-pot settle bound: a pot's ACCRUING payees, drawn from its parent's ActList, are pooled records, at most P_MAX, while exited victims may make the live ACCRUING records outnumber P_MAX, with a v3-preview settle of 64 exited victims filled and promoted measured at 6,274,600 within the unchanged entry) and the mutant fixture gains eighteen contest mutants (pool-contest-erased-at-once, the first draft, and pool-victim-held-reactivation-takes-a-pool-seat included); reachable only via the v3 sysCodeHash on a specVersion-2 genesis (CP schema v2), which SPEC_VERSION=1 builds refuse; system-v1/continuous/earnin.json, their sysCodeHashes, GAS_ENVELOPE, GAS_ENVELOPE_EARNIN, every constant, the V1/Continuous/EarnIn admission facts (H15000 included), the identity and every spec-1 verdict and root unchanged (re-pinned on main after V3-PR-E2a and N4)"
