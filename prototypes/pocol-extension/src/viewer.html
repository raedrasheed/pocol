<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/pocol-32.png"><title>PoCol</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="bar">
  <img src="icons/pocol-32.png" width="24" height="24" alt="PoCol" style="flex-shrink:0">
  <span id="trust" class="badge">…</span>
  <span id="where" dir="ltr"></span>
  <span id="ver"></span>
  <span id="status" role="status"></span>
</header>
<main id="stage"></main>
<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle"></h2>
    <pre id="mtext" dir="ltr"></pre>
    <div id="boundrow" hidden><label for="bound">Signed maximum in wei (gas·maxFee; bounds gas and creation burn together)</label> <input id="bound" type="text" inputmode="numeric" autocomplete="off" dir="ltr"> <button id="rebound" type="button">Review with this maximum</button> <span id="bounderr" role="alert"></span></div>
    <div class="btns"><button id="approve" type="button">Approve</button><button id="reject" type="button">Reject</button></div>
  </div>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
